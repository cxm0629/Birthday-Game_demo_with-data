<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#191a17">
  <meta name="description" content="Final star-gathering ending animation preview">
  <title>Ending Animation Preview</title>
  <link rel="stylesheet" href="ending-demo.css">
</head>
<body>
  <main class="demo" aria-label="生日结尾星光动画预览">
    <div class="ambient" aria-hidden="true"></div>
    <section class="stage" id="stage" aria-label="24颗参与者星星正在聚拢">
      <div class="stars" id="stars" aria-hidden="true"></div>
      <div class="message" id="message">
        <p>For one special person</p>
        <h1>Happy Birthday</h1>
        <span>愿这些微小的光，安静地陪你走进新的一年。</span>
      </div>
    </section>
    <div class="controls">
      <span>24 participant stars · visual preview</span>
      <button id="replay" type="button">↻ Replay Animation</button>
    </div>
  </main>
  <script src="ending-demo.js"></script>
</body>
</html>
