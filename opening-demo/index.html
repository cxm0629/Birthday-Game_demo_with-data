<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#191a17">
  <meta name="description" content="生日互动游戏独立开场动画预览">
  <title>一点微光 · Opening Demo</title>
  <link rel="stylesheet" href="opening-demo.css">
</head>
<body>
  <main class="opening" id="opening" aria-label="一点微光开场动画">
    <div class="atmosphere" aria-hidden="true"></div>
    <section class="story" aria-live="polite">
      <div class="light-wrap" aria-hidden="true">
        <i class="light-core"></i>
      </div>
      <div class="copy">
        <p class="line line-one">今天，有一些人留下了一些线索。</p>
        <p class="line line-two">顺着这点微光，去找到他们吧。</p>
      </div>
      <button class="start" id="start" type="button">开始寻找</button>
    </section>
  </main>
  <script src="opening-demo.js"></script>
</body>
</html>
