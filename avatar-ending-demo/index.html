<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#191a17">
  <meta name="description" content="Participant avatar ending animation preview">
  <title>Avatar Ending Animation Preview</title>
  <link rel="stylesheet" href="avatar-ending-demo.css">
</head>
<body>
  <main class="demo" id="demo" aria-label="参与者头像聚拢成爱心的生日结尾动画">
    <div class="ambient" aria-hidden="true"></div>
    <section class="stage" id="stage">
      <figure class="chibi" id="chibi" aria-label="小米的Q版形象">
        <img src="xiaomi-chibi.webp" alt="小米坐在月亮上的Q版插画">
      </figure>
      <div class="participants" id="participants"></div>
      <p class="blessing" id="blessing">愿这些微小的光，安静地陪你走进新的一年。</p>
      <p class="loading" id="loading">正在等大家来到这里…</p>
    </section>
    <div class="controls">
      <span id="countLabel">Loading participants…</span>
      <button id="replay" type="button" disabled>↻ Replay Animation</button>
    </div>
  </main>
  <script src="avatar-ending-demo.js"></script>
</body>
</html>
